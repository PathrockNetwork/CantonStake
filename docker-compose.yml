# CantonStake app-layer services.
#
# This compose file runs the backend, frontend, PostgreSQL, and Redis.
# It assumes CN Quickstart LocalNet is already running separately via
# `make start` from the cn-quickstart/quickstart directory.
#
# Usage:
#   1. Start LocalNet: cd ../cn-quickstart/quickstart && make start
#   2. Configure the real staking-network endpoints and validator registry.
#   3. Copy the deployed address, party IDs, and FeaturedAppRight CID into .env
#   4. From the cantonstake root: docker compose up --build
#
# The backend connects to LocalNet's App Provider participant on
# host.docker.internal:3975 (JSON Ledger API).
#
# Two deployments share this file — one per network mode
# (docs/NETWORK_MODES.md). Every project-scoped name/port comes from env so
# the stacks never collide:
#
#   mainnet: docker compose -p cantonstake --env-file .env up -d
#            (STACK_NAME/ports default below; NETWORK_MODE=mainnet comes
#            from .env)
#   testnet: docker compose -p cantonstake-testnet \
#              --env-file .env --env-file .env.testnet up -d
#            (the testnet file overrides mode, ports and STACK_NAME; later
#            --env-file wins)

services:
  # ── Persistence ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ${STACK_NAME:-cantonstake}-postgres
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: cantonstake
      POSTGRES_PASSWORD: cantonstake
      POSTGRES_DB: cantonstake
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cantonstake"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-256m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: "25m"
        max-file: "4"

  redis:
    image: redis:7-alpine
    container_name: ${STACK_NAME:-cantonstake}-redis
    # Backends use redis:6379 on their private Compose network. Host access
    # is loopback-only: an unauthenticated public Redis port permits takeover.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    logging: *bounded-logs
    mem_limit: ${REDIS_MEMORY_LIMIT:-384m}
    mem_reservation: ${REDIS_MEMORY_RESERVATION:-64m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    # BullMQ requires noeviction. Refuse extra writes rather than evict jobs.
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-192mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Application ──────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_to:
        - type=inline
    image: ${BACKEND_IMAGE:-cantonstake-backend:local}
    container_name: ${STACK_NAME:-cantonstake}-backend
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-4001}:4001"
    environment:
      - PORT=4001
      - LOG_LEVEL=info
      - NETWORK_MODE=${NETWORK_MODE:-testnet}
      - MAINNET_CONFIRMED=${MAINNET_CONFIRMED:-no}
      - ENABLED_CHAINS=${ENABLED_CHAINS:-polygon}
      - SPOL_TEST_ENABLED=${SPOL_TEST_ENABLED:-false}
      - SPOL_TEST_ROUTER=${SPOL_TEST_ROUTER:-}
      - SPOL_TEST_QUOTER=${SPOL_TEST_QUOTER:-}
      - SPOL_TEST_WRAPPER=${SPOL_TEST_WRAPPER:-}
      - SPOL_TEST_POOL=${SPOL_TEST_POOL:-}
      - RPC_FALLBACK_URLS=${RPC_FALLBACK_URLS:-}
      - AMOY_RPC_URL=${AMOY_RPC_URL:-}
      - STAKE_SETTLEMENT_RPC_URL=${STAKE_SETTLEMENT_RPC_URL:-}
      - STAKE_SETTLEMENT_FALLBACK_RPC_URL=${STAKE_SETTLEMENT_FALLBACK_RPC_URL:-}
      - STAKE_SETTLEMENT_CHAIN_ID=${STAKE_SETTLEMENT_CHAIN_ID:-}
      - POLYGON_STAKE_MANAGER_ADDRESS=${POLYGON_STAKE_MANAGER_ADDRESS:-}
      - POLYGON_STAKING_LOGGER_ADDRESS=${POLYGON_STAKING_LOGGER_ADDRESS:-}
      - CANTON_NETWORK=${CANTON_NETWORK:-}
      - CANTON_JSON_API_URL=${CANTON_JSON_API_URL:-http://host.docker.internal:3975}
      - CANTON_DELEGATOR_JSON_API_URL=${CANTON_DELEGATOR_JSON_API_URL:-}
      - CANTON_USER_ID=${CANTON_USER_ID:-}
      - CANTON_DELEGATOR_USER_ID=${CANTON_DELEGATOR_USER_ID:-}
      - CANTON_SYNCHRONIZER_ID=${CANTON_SYNCHRONIZER_ID:-}
      - CANTON_PACKAGE_ID=${CANTON_PACKAGE_ID:-}
      - CANTON_MODERN_EVENT_FORMAT=${CANTON_MODERN_EVENT_FORMAT:-false}
      - CANTON_WRITE_ACCESS_PROTECTED=${CANTON_WRITE_ACCESS_PROTECTED:-false}
      - CANTON_APP_PROVIDER_PARTY=${CANTON_APP_PROVIDER_PARTY}
      - CANTON_AUTH_TOKEN=${CANTON_AUTH_TOKEN:-}
      - CANTON_DELEGATOR_PARTY=${CANTON_DELEGATOR_PARTY}
      - CANTON_DELEGATOR_AUTH_TOKEN=${CANTON_DELEGATOR_AUTH_TOKEN:-}
      - CANTON_OAUTH_TOKEN_URL=${CANTON_OAUTH_TOKEN_URL:-}
      - CANTON_OAUTH_AUDIENCE=${CANTON_OAUTH_AUDIENCE:-}
      - CANTON_OAUTH_SCOPE=${CANTON_OAUTH_SCOPE:-daml_ledger_api}
      - CANTON_OAUTH_CLIENT_ID=${CANTON_OAUTH_CLIENT_ID:-}
      - CANTON_OAUTH_CLIENT_SECRET=${CANTON_OAUTH_CLIENT_SECRET:-}
      - CANTON_DELEGATOR_OAUTH_CLIENT_ID=${CANTON_DELEGATOR_OAUTH_CLIENT_ID:-}
      - CANTON_DELEGATOR_OAUTH_CLIENT_SECRET=${CANTON_DELEGATOR_OAUTH_CLIENT_SECRET:-}
      - FEATURED_APP_RIGHT_CID=${FEATURED_APP_RIGHT_CID:-}
      - BENEFICIARY_SPLIT_CID=${BENEFICIARY_SPLIT_CID:-}
      - USE_LEGACY_MARKERS=${USE_LEGACY_MARKERS:-false}
      - DATABASE_URL=postgresql://cantonstake:cantonstake@postgres:5432/cantonstake?connection_limit=${DATABASE_CONNECTION_LIMIT:-10}&pool_timeout=10
      - REDIS_URL=redis://redis:6379
      - SCAN_API_URL=${SCAN_API_URL:-}
      - REWARD_SOURCE=${REWARD_SOURCE:-}
      - PAYOUTS_ENABLED=${PAYOUTS_ENABLED:-false}
      - TOKEN_REGISTRY_URL=${TOKEN_REGISTRY_URL:-}
      - CANTON_TREASURY_PARTY=${CANTON_TREASURY_PARTY:-}
      - PAYOUT_MIN_CC=${PAYOUT_MIN_CC:-1.0}
      - REWARD_MODEL=${REWARD_MODEL:-}
      - SIM_TRAFFIC_USD_PER_MB=${SIM_TRAFFIC_USD_PER_MB:-}
      - SIM_BYTES_PER_TX=${SIM_BYTES_PER_TX:-}
      - SIM_FREE_BYTES_PER_ROUND=${SIM_FREE_BYTES_PER_ROUND:-}
      - SIM_REWARD_TO_FEE_RATIO=${SIM_REWARD_TO_FEE_RATIO:-}
      - SIM_MAX_USD_PER_TX=${SIM_MAX_USD_PER_TX:-}
      - SIM_MIN_ROUND_USD=${SIM_MIN_ROUND_USD:-}
      - SCAN_PAGE_SIZE=${SCAN_PAGE_SIZE:-500}
      - SCAN_ROUND_CC_POOL=${SCAN_ROUND_CC_POOL:-100}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VALIDATOR_SCORING_DISABLED=${VALIDATOR_SCORING_DISABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DISCORD_DEFAULT_WEBHOOK=${DISCORD_DEFAULT_WEBHOOK:-}
      - AUTO_COMPOUND_DISABLED=${AUTO_COMPOUND_DISABLED:-true}
      - AUTO_COMPOUND_KEEPER_KEY=${AUTO_COMPOUND_KEEPER_KEY:-}
      - MONAD_RPC_URL=${MONAD_RPC_URL:-}
      - MONAD_STAKING_CONTRACT=${MONAD_STAKING_CONTRACT:-}
      - BNB_RPC_URL=${BNB_RPC_URL:-}
      - COSMOS_REST_URL=${COSMOS_REST_URL:-}
      - COSMOS_RPC_URL=${COSMOS_RPC_URL:-}
      - CELESTIA_RPC_URL=${CELESTIA_RPC_URL:-}
      - CELESTIA_REST_URL=${CELESTIA_REST_URL:-}
      - OSMOSIS_RPC_URL=${OSMOSIS_RPC_URL:-}
      - OSMOSIS_REST_URL=${OSMOSIS_REST_URL:-}
      - APTOS_REST_URL=${APTOS_REST_URL:-}
      - APTOS_INDEXER_URL=${APTOS_INDEXER_URL:-}
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-}
      - POLKADOT_RPC_URL=${POLKADOT_RPC_URL:-}
      - COSMOS_KEEPER_MNEMONIC=${COSMOS_KEEPER_MNEMONIC:-}
      - SUI_GRAPHQL_URL=${SUI_GRAPHQL_URL:-}
      - SUI_KEEPER_PRIVATE_KEY=${SUI_KEEPER_PRIVATE_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENV=${SENTRY_ENV:-production}
      - LOOP_PROXY_ENABLED=${LOOP_PROXY_ENABLED:-true}
      - LOOP_API_UPSTREAM=${LOOP_API_UPSTREAM:-https://devnet.cantonloop.com}
      - LOOP_STAKING_ENABLED=${LOOP_STAKING_ENABLED:-false}
      - LOOP_REVIEWED_PACKAGE_ID=${LOOP_REVIEWED_PACKAGE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1536m}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-384m}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/api/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_NETWORK_MODE: ${NEXT_PUBLIC_NETWORK_MODE:-testnet}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4001}
        NEXT_PUBLIC_ENABLED_CHAINS: ${NEXT_PUBLIC_ENABLED_CHAINS:-polygon}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_POLYGON_SETTLEMENT_CHAIN_ID: ${NEXT_PUBLIC_POLYGON_SETTLEMENT_CHAIN_ID:-}
        NEXT_PUBLIC_POLYGON_STAKE_MANAGER: ${NEXT_PUBLIC_POLYGON_STAKE_MANAGER:-}
        NEXT_PUBLIC_POLYGON_STAKING_LOGGER: ${NEXT_PUBLIC_POLYGON_STAKING_LOGGER:-}
        NEXT_PUBLIC_POLYGON_STAKE_TOKEN: ${NEXT_PUBLIC_POLYGON_STAKE_TOKEN:-}
        NEXT_PUBLIC_SHARE_SLIPPAGE_BPS: ${NEXT_PUBLIC_SHARE_SLIPPAGE_BPS:-}
        NEXT_PUBLIC_LOOP_NETWORK: ${NEXT_PUBLIC_LOOP_NETWORK:-devnet}
        NEXT_PUBLIC_LOOP_STAKING_FLOW: ${NEXT_PUBLIC_LOOP_STAKING_FLOW:-legacy}
        NEXT_PUBLIC_LOOP_SDK_ENABLED: ${NEXT_PUBLIC_LOOP_SDK_ENABLED:-true}
        NEXT_PUBLIC_CC_USD: ${NEXT_PUBLIC_CC_USD:-0.16}
        NEXT_PUBLIC_REAL_VALIDATOR_SHARES: ${NEXT_PUBLIC_REAL_VALIDATOR_SHARES:-{}}
        NEXT_PUBLIC_LOOP_USE_BACKEND_PROXY: ${NEXT_PUBLIC_LOOP_USE_BACKEND_PROXY:-false}
        NEXT_PUBLIC_LOOP_API_URL: ${NEXT_PUBLIC_LOOP_API_URL:-}
        NEXT_PUBLIC_LOOP_WALLET_URL: ${NEXT_PUBLIC_LOOP_WALLET_URL:-}
        NEXT_PUBLIC_COSMOS_CHAIN_ID: ${NEXT_PUBLIC_COSMOS_CHAIN_ID:-}
        NEXT_PUBLIC_COSMOS_CHAIN_NAME: ${NEXT_PUBLIC_COSMOS_CHAIN_NAME:-}
        NEXT_PUBLIC_COSMOS_COIN_DENOM: ${NEXT_PUBLIC_COSMOS_COIN_DENOM:-ATOM}
        NEXT_PUBLIC_COSMOS_COIN_MINIMAL_DENOM: ${NEXT_PUBLIC_COSMOS_COIN_MINIMAL_DENOM:-uatom}
        NEXT_PUBLIC_COSMOS_COIN_DECIMALS: ${NEXT_PUBLIC_COSMOS_COIN_DECIMALS:-6}
        NEXT_PUBLIC_COSMOS_COIN_TYPE: ${NEXT_PUBLIC_COSMOS_COIN_TYPE:-118}
        NEXT_CACHE_ID: cantonstake-next-${NEXT_PUBLIC_NETWORK_MODE:-testnet}
        SKIP_BUILD_CHECKS: ${SKIP_FRONTEND_BUILD_CHECKS:-false}
    image: ${FRONTEND_IMAGE:-cantonstake-frontend:local}
    container_name: ${STACK_NAME:-cantonstake}-frontend
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3001}:3000"
    environment:
      - NEXT_PUBLIC_NETWORK_MODE=${NEXT_PUBLIC_NETWORK_MODE:-testnet}
      # Next standalone otherwise binds Docker's container hostname, excluding
      # loopback and causing the local health probe to fail despite proxy access.
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4001}
      - NEXT_PUBLIC_ENABLED_CHAINS=${NEXT_PUBLIC_ENABLED_CHAINS:-polygon}
      - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-128m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.75}
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  redisdata:
